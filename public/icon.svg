<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="25%" stop-color="#EA4335"/>
      <stop offset="50%" stop-color="#FBBC05"/>
      <stop offset="75%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="#06081a"/>
  <!-- 外圈刻度环 -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- 刻度线 — 12个方向 -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="48" x2="256" y2="68"/>
    <line x1="256" y1="444" x2="256" y2="464"/>
    <line x1="48" y1="256" x2="68" y2="256"/>
    <line x1="444" y1="256" x2="464" y2="256"/>
  </g>
  <g stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="42" x2="256" y2="58"/>
    <line x1="256" y1="454" x2="256" y2="470"/>
    <line x1="42" y1="256" x2="58" y2="256"/>
    <line x1="454" y1="256" x2="470" y2="256"/>
    <line x1="104" y1="104" x2="115" y2="115"/>
    <line x1="397" y1="397" x2="408" y2="408"/>
    <line x1="408" y1="104" x2="397" y2="115"/>
    <line x1="104" y1="408" x2="115" y2="397"/>
  </g>
  <!-- 内部几何图案 — 抽象的 "C" 和计数线条 -->
  <!-- 左侧弧形 — 代表 C -->
  <path d="M 170 160 A 96 96 0 1 0 170 352"
        fill="none" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
  <!-- 右上角竖线 — 计数刻度 -->
  <line x1="310" y1="140" x2="310" y2="230"
        stroke="rgba(255,255,255,0.35)" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="120" x2="340" y2="250"
        stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="100" x2="370" y2="270"
        stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
  <!-- 底部水平线 — 代表基准 -->
  <line x1="160" y1="340" x2="370" y2="340"
        stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <!-- 中央几何菱形 -->
  <polygon points="256,210 286,256 256,302 226,256"
           fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- 中心点 -->
  <circle cx="256" cy="256" r="6" fill="url(#lg)"/>
</svg>
